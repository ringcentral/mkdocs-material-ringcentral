[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-material-ringcentral"
version = "1.0.2"
description = "RingCentral 2026 brand layer plugin for MkDocs Material"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "RingCentral Labs", email = "devsupport@ringcentral.com" }
]
keywords = [
  "mkdocs", "mkdocs-plugin", "mkdocs-material",
  "ringcentral", "documentation", "theme"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
requires-python = ">=3.9"
dependencies = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.0",
]

[project.urls]
Homepage     = "https://github.com/ringcentral/mkdocs-material-ringcentral"
Documentation = "https://github.com/ringcentral/mkdocs-material-ringcentral#readme"
Repository   = "https://github.com/ringcentral/mkdocs-material-ringcentral"
Issues       = "https://github.com/ringcentral/mkdocs-material-ringcentral/issues"
Changelog    = "https://github.com/ringcentral/mkdocs-material-ringcentral/releases"

[project.entry-points."mkdocs.plugins"]
material-ringcentral = "mkdocs_material_ringcentral.plugin:RingCentralPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["mkdocs_material_ringcentral*"]

[tool.setuptools.package-data]
mkdocs_material_ringcentral = [
  "assets/*",
  "templates/*",
]
